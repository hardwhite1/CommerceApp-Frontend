
<div class="products-frame">

    <section class="products-container">

        <header class="products-header">
            <div>
                <h2>Our Products</h2>
                <p>Explore our available products.</p>
            </div>
            <div class="section-heading">
                <div class="heading-icon">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="22" height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" [attr.aria-label]="cartQuantity + ' items in cart'">
                        {{ cartQuantity }}
                    </span>
                </div>

                <h3>Shopping Cart</h3>
            </div>
        </header>

        <div class="products-grid">

            <article class="product-card" *ngFor="let product of products">

                <div class="product-image">
                    <img [src]="product.pictureUrl"
                         [alt]="product.name">
                </div>

                <div class="product-content">

                    <span class="product-category">
                        {{ product.category }}
                    </span>

                    <h3>{{ product.name }}</h3>

                    <p class="product-brand">
                        {{ product.brand }}
                    </p>

                    <div class="product-footer">

                        <span class="product-price">
                            {{ product.price | currency }}
                        </span>

                        <a [routerLink]="['/products-details', product.id]"
                           class="details-btn">
                            View Details
                        </a>

                    </div>

                </div>

            </article>

        </div>

    </section>

</div>
